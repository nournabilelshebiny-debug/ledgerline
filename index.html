<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ledgerline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F1;--card:#FFFFFF;--ink:#16221E;--muted:#5C6A64;--line:#D8DFDA;--soft:#E7ECE8;
  --accent:#2848A8;--on-accent:#FFFFFF;--pos:#1B7548;--neg:#B0392D;--warn:#8F6209;
  --pos-bg:#DDF0E5;--neg-bg:#F7DEDA;--warn-bg:#F6E8C8;--acc-bg:#DFE6F7;
  --s1:#2848A8;--s2:#6A86D3;--s3:#A9BBEA;--t1:#1F6F62;--t2:#58A394;--t3:#A4D0C7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111916;--card:#19231F;--ink:#E6EEE9;--muted:#93A29B;--line:#2A3732;--soft:#222E29;
    --accent:#8AA4F2;--on-accent:#0E1A3A;--pos:#5CC48E;--neg:#F28576;--warn:#E3B650;
    --pos-bg:#1B3A2B;--neg-bg:#42231F;--warn-bg:#3F3216;--acc-bg:#1F2A4A;
    --s1:#8AA4F2;--s2:#5F7CCB;--s3:#3C5195;--t1:#5FC1AE;--t2:#3E8F80;--t3:#2A6157;
  }
}
:root[data-theme="dark"]{
  --paper:#111916;--card:#19231F;--ink:#E6EEE9;--muted:#93A29B;--line:#2A3732;--soft:#222E29;
  --accent:#8AA4F2;--on-accent:#0E1A3A;--pos:#5CC48E;--neg:#F28576;--warn:#E3B650;
  --pos-bg:#1B3A2B;--neg-bg:#42231F;--warn-bg:#3F3216;--acc-bg:#1F2A4A;
  --s1:#8AA4F2;--s2:#5F7CCB;--s3:#3C5195;--t1:#5FC1AE;--t2:#3E8F80;--t3:#2A6157;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{min-height:100%;margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.45 'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
#nav{position:fixed;inset-inline:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(var(--n,6),1fr);
  background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav .brand{display:none}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:11px;color:var(--muted);border-radius:8px}
#nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
#top{margin-bottom:14px}
#top h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
#top .date{font-size:13px;color:var(--muted)}
@media (min-width:900px){
  #nav{top:0;inset-inline-end:auto;width:208px;grid-template-columns:1fr;align-content:start;gap:2px;
    border-top:0;border-inline-end:1px solid var(--line);padding:20px 12px}
  #nav .brand{display:block;font-weight:600;font-size:18px;padding:4px 10px 18px;letter-spacing:-.01em}
  #nav button{flex-direction:row;gap:12px;font-size:14px;padding:10px;justify-content:flex-start}
  main{margin-inline-start:208px;max-width:none;padding:28px 36px 48px}
  .wrap{max-width:900px}
}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:500;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--accent);margin:4px 0 12px}
.btn.danger{color:var(--neg);border-color:var(--neg);background:transparent}
.btn.wide{width:100%;padding:12px}
.btn.sm{padding:6px 10px;font-size:13px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;margin-bottom:14px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:12px}

/* content blocks */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:start;
  background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--soft)}
.row .grow{min-width:0;flex:1}
.row .end{text-align:end;flex:none;max-width:55%}
.sub{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:1px 7px;border-radius:4px;margin-top:2px}
.badge.ok{background:var(--pos-bg);color:var(--pos)}
.badge.bad{background:var(--neg-bg);color:var(--neg)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--acc-bg);color:var(--accent)}
.badge.mute{background:var(--soft);color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;margin-bottom:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--muted);text-align:start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.tbl td{padding:7px 0;border-bottom:1px solid var(--soft)}
.tbl .r{text-align:end}
.tbl tr.total td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.tbl tr.group td{padding-top:12px;color:var(--muted);font-size:13px;border-bottom:0}
.scroll{overflow-x:auto}

/* balance strip */
.bars{display:grid;gap:10px;margin:6px 0 12px}
.bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.barlab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}
.legend span:last-child{margin-inline-start:auto}
.legend .grp{grid-column:1/-1}
.status{font-size:13px;margin-top:8px}

/* alerts */
.alert{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft);background:none;border-inline:0;border-top:0;width:100%;text-align:start;color:inherit}
.alert:last-child{border-bottom:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(10,18,15,.5);z-index:40}
#sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);
  border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
@media (min-width:700px){
  #sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;max-height:88%;border-radius:14px;animation:none}
}
#sheet[hidden],#scrim[hidden]{display:none}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.shead h2{margin:0;font-size:18px;font-weight:600}
.shead button{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.line input,.line select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px;min-width:0}
.fld.chk{display:flex;gap:8px;align-items:center}
.fld.chk input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lh,.line{display:grid;grid-template-columns:1fr 70px 88px 32px;gap:6px;align-items:center}
.lh{font-size:13px;color:var(--muted);margin-bottom:4px}
.line{margin-bottom:8px}
.line .x{border:0;background:var(--soft);height:36px;border-radius:8px;font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:17px;padding:10px 0 14px;border-top:1px solid var(--line);margin-top:4px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:10px 0 14px}
.sum .big{font-weight:600;font-size:16px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90%;text-align:center}
#toast[hidden]{display:none}
#toast.err{background:var(--neg);color:#fff}
@media (min-width:900px){#toast{bottom:28px}}
.jentry{padding:12px 14px;border-bottom:1px solid var(--line)}
.jentry:last-child{border-bottom:0}
.jhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.badge+.badge{margin-inline-start:4px}
.sh{font-size:16px;font-weight:600;margin:20px 0 10px}
.goal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gnum{font-size:46px;font-weight:600;line-height:1;letter-spacing:-.03em}
.gof{color:var(--muted);font-size:15px}
.pbar{display:flex;height:24px;border-radius:5px;overflow:hidden;background:var(--soft);margin:14px 0 10px}
.pbar i{display:block;height:100%;border-right:2px solid var(--card)}
.plegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.plegend i,.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.pstat{margin-top:10px;font-weight:600}
.rep{background:var(--card);border:1px solid var(--line);border-inline-start-width:5px;border-radius:10px;padding:12px;margin-bottom:10px}
.rep .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rg .l{font-size:12px;color:var(--muted)}
.rg .v{font-weight:600;font-size:15px}
@media (min-width:700px){.rg{grid-template-columns:repeat(6,1fr)}}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.datebar input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
:root{--r1:#2848A8;--r2:#1F7A6B;--r3:#A35A12;--r4:#8A3F8F;--r5:#5E7F1D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--r1:#8AA4F2;--r2:#5FC1AE;--r3:#E3A55C;--r4:#D08AD6;--r5:#A3C760}}
:root[data-theme="dark"]{--r1:#8AA4F2;--r2:#5FC1AE;--r3:#E3A55C;--r4:#D08AD6;--r5:#A3C760}
:root{--on-pos:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-pos:#0B2217}}
:root[data-theme="dark"]{--on-pos:#0B2217}
[dir="rtl"] .flip{transform:scaleX(-1)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.util{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.util .push{margin-inline-start:auto}
.lnk{background:none;border:0;color:var(--accent);padding:6px 0;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hi{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 2px}
.date{font-size:13px;color:var(--muted)}
body.picker #nav,body.picker #top{display:none}
body.picker main,body.role-rep main{max-width:560px;margin-inline:auto}
.pick{padding-top:6px}
.pick h1{font-size:26px;margin:6px 0 20px;letter-spacing:-.01em}
.brand2{font-weight:600;font-size:15px;color:var(--accent)}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;font-size:18px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:12px 16px}
.bigbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bigbtn.pos{background:var(--pos);border-color:var(--pos);color:var(--on-pos)}
.bigbtn:disabled{opacity:.45}
.bigbtn.who{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;margin-bottom:10px;text-align:start}
.bigbtn.who .sub{font-weight:400}
body.role-rep{font-size:16px}
body.role-rep main{padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  body.role-rep #nav{top:auto;inset-inline:0;width:auto;grid-template-columns:repeat(2,1fr);border-inline-end:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  body.role-rep #nav button{flex-direction:column;justify-content:center;font-size:12px}
  body.role-rep main,body.picker main{margin-inline-start:auto;max-width:560px;padding:20px 14px 96px}
}
body.role-rep #nav button{font-size:13px;padding:8px 0}
.rprog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.pbar.one{margin:12px 0 8px}
.rp2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--soft)}
.rp2 .l{font-size:13px;color:var(--muted)}.rp2 .v{font-size:22px;font-weight:600}
.ccard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;padding-inline-start:16px;margin-bottom:10px;text-align:start;color:inherit}
.ccard .ci{flex:1;min-width:0}.ccard .ci b{font-size:17px}
.go{flex:none;min-width:116px;min-height:54px;border-radius:12px;border:0;background:var(--pos);color:var(--on-pos);font-size:17px;font-weight:600;padding:0 14px}
.go.sm{min-width:0;min-height:42px;display:inline-flex;align-items:center;background:var(--accent);color:var(--on-accent);font-size:15px}
.ccard.prog{border:2px solid var(--accent)}
.ccard.done{background:var(--soft)}
.tick{color:var(--pos);font-size:24px}
.vh{margin:8px 0 14px}
.vstep{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:600}
.sbody{flex:1;min-width:0}.sbody h2{font-size:17px;margin:4px 0 12px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okline{font-weight:600;margin-bottom:6px}.ok{color:var(--pos)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.step{display:flex;align-items:center;gap:8px;flex:none}
.stepbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:24px;line-height:1}
.stepbtn:disabled{opacity:.35}
.qn{min-width:30px;text-align:center;font-size:19px;font-weight:600}
.chart{margin-top:4px}
.plot{position:relative;height:150px;border-bottom:1px solid var(--line);margin-top:22px}
.bars{display:flex;height:100%}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.b{position:relative;width:36%;max-width:24px;border-radius:3px 3px 0 0;min-height:1px}
.b em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.tline{position:absolute;inset-inline:0;border-top:2px dashed var(--accent)}
.tline span{position:absolute;inset-inline-end:0;bottom:2px;font-size:11px;color:var(--accent);background:var(--card);padding:0 4px}
.lbls{display:flex}.lbls span{flex:1;text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
.perf{padding:12px 0;border-bottom:1px solid var(--soft)}.perf:first-child{padding-top:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pb{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.pb i{display:block;height:100%}
.ps{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}.ps b{color:var(--ink);font-weight:600}
.panel>.btn.sm{margin-top:12px}
.notice{border-color:var(--accent);background:var(--acc-bg)}
.notice p{margin:6px 0 10px}
.logo{height:28px;width:auto;max-width:120px;object-fit:contain;border-radius:6px;vertical-align:middle;margin-inline-end:8px}
.logo.lg{height:72px;max-width:200px;margin:0}
.logoedit{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.logoph{width:72px;height:72px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center}
.sh2{font-size:15px;font-weight:600;margin:6px 0 10px}
.brandsm{display:inline-flex;align-items:center;font-weight:600;font-size:14px}
@media (min-width:900px){.brandsm:not(.always){display:none}}
.brand{display:flex;align-items:center}
.atools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.atools .search{margin:0}
.atools select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;max-width:150px}
.arow{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.chkbox{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none}
.chkbox input{width:20px;height:20px}
.selbtn{flex:1;min-width:0;background:none;border:0;text-align:start;padding:8px 4px;color:inherit}
.arow .end{flex:none;max-width:42%;text-align:end;font-size:14px}
.selbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.selbar select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px;flex:1;min-width:120px}
@media (min-width:900px){.selbar{bottom:16px}}

/* ---- translation: screens are written in English and translated at the last moment ---- */
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function compileP(){ARPC=ARP.map(function(p){var parts=p[0].split(/\{\d\}/);return {re:new RegExp('^'+parts.map(escRe).join('(.+?)')+'$'),out:p[1],len:p[0].length}}).sort(function(a,b){return b.len-a.len})}
function trIn(c){
  if(Object.prototype.hasOwnProperty.call(AR,c))return AR[c];
  if(!ARPC)compileP();
  for(var i=0;i<ARPC.length;i++){var m=c.match(ARPC[i].re);if(m)return ARPC[i].out.replace(/\{(\d)\}/g,function(x,n){var r=trIn(m[+n+1]);return r===null?m[+n+1]:r})}
  return null;
}
function trText(s){
  if(L!=='ar'||!s)return s;
  var m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return s;
  var r=trIn(m[2]);
  if(r===null){if(/[A-Za-z]{3,}/.test(m[2]))MISS[m[2]]=1;return s}
  return m[1]+r+m[3];
}
function tr(h){
  if(L!=='ar')return h;
  h=h.replace(/>([^<>]+)</g,function(x,s){return '>'+trText(s)+'<'});
  return h.replace(/\b(placeholder|aria-label|title|label)="([^"]*)"/g,function(x,a,v){return a+'="'+trText(v)+'"'});
}
function setHTML(el,h){el.innerHTML=tr(h)}

/* ---- helpers ---- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function LOC(){return L==='ar'?'ar-u-nu-latn':'en-US'}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(new Date())}
function addDays(iso,n){var d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function fdate(iso){var d=new Date(iso+'T12:00:00Z');return d.toLocaleDateString(LOC(),{timeZone:'UTC',month:'short',day:'numeric',year:iso.slice(0,4)===today().slice(0,4)?undefined:'numeric'})}
function dayShort(iso){return new Date(iso+'T12:00:00Z').toLocaleDateString(LOC(),{timeZone:'UTC',weekday:'short'})}
function ftime(iso){return new Date(iso).toLocaleTimeString(LOC(),{timeZone:'Africa/Cairo',hour:'numeric',minute:'2-digit'})}
function nameOf(p){return p?(p.full_name||p.email||'?'):''}

  err:'',busy:false,draft:{},sheet:null,visit:null,sel:{},q:'',filter:'all',arep:'',vq:''};
function isOwner(){return !!(S.profile&&S.profile.role==='owner')}
function curDate(){return S.vd||today()}
function teamMap(){var m={};S.team.forEach(function(p){m[p.id]=p});return m}
function custMap(){var m={};S.customers.forEach(function(c){m[c.id]=c});return m}

function targetFor(d){var v=35;S.targets.slice().sort(function(a,b){return a.effective_from<b.effective_from?-1:1}).forEach(function(x){if(x.effective_from<=d)v=x.value});return v}

/* ---- numbers for one day ---- */
function dayStats(){
  var d=curDate(),tm=teamMap(),vs=S.visits.slice().sort(function(a,b){return a.checked_in_at<b.checked_in_at?-1:1}),first={};
  vs.forEach(function(v){if(!first[v.customer_id])first[v.customer_id]=v});
  var unique=Object.keys(first).length,ids={};
  S.team.forEach(function(p){if(p.active&&p.role!=='owner')ids[p.id]=1});vs.forEach(function(v){ids[v.rep_id]=1});
  var reps=Object.keys(ids).map(function(rid){
    var mine=vs.filter(function(v){return v.rep_id===rid}),cred=mine.filter(function(v){return first[v.customer_id]===v}).length;
    var assigned=S.customers.filter(function(c){return c.assigned_to===rid&&c.active});
    return {id:rid,name:nameOf(tm[rid]),visits:mine.length,credited:cred,shared:mine.length-cred,assigned:assigned.length,missed:assigned.filter(function(c){return !first[c.id]}).length};
  }).sort(function(a,b){return a.name<b.name?-1:1});
  return {date:d,target:targetFor(d),unique:unique,repeat:vs.length-unique,reps:reps,first:first,
    visits:vs.map(function(v){return Object.assign({},v,{credited:first[v.customer_id]===v})}),
    notReached:S.customers.filter(function(c){return c.active&&!first[c.id]})};
}

function kpi(l,v,cls,sub){return '<div class="kpi"><div class="l">'+l+'</div><div class="v num '+(cls||'')+'">'+v+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'}

function fld(label,name,type,val,extra){return '<label class="fld"><span>'+label+'</span><input name="'+name+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'></label>'}
function alertRow(kind,title,sub,count,go){return '<button class="alert" data-a="goto" data-t="'+go[0]+'" data-s="'+(go[1]||'')+'"><span><b>'+title+'</b>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</span>'+badge(kind,String(count))+'</button>'}
function barChart(cols,o){
  var mx=o.target||0;cols.forEach(function(c){c.vals.forEach(function(v){if(v>mx)mx=v})});mx=mx||1;
  var bars=cols.map(function(c){return '<div class="col">'+c.vals.map(function(v,i){return '<div class="b" style="height:'+(v/mx*100).toFixed(1)+'%;background:'+(c.color||o.colors[i])+'">'+(o.showVals?'<em>'+v+'</em>':'')+'</div>'}).join('')+'</div>'}).join('');
  return '<div class="chart"><div class="plot">'+(o.target?'<div class="tline" style="bottom:'+(o.target/mx*100).toFixed(1)+'%"><span>'+o.tlabel+' '+o.target+'</span></div>':'')+'<div class="bars">'+bars+'</div></div><div class="lbls">'+cols.map(function(c){return '<span>'+c.label+'</span>'}).join('')+'</div></div>';

  var segs=st.reps.filter(function(r){return r.credited>0}).map(function(r){return '<i title="'+esc(r.name)+': '+r.credited+'" style="width:'+(r.credited/span*100)+'%;background:'+colorOf(r.id)+'"></i>'}).join('');
  var leg=st.reps.map(function(r){return '<span><i style="background:'+colorOf(r.id)+'"></i>'+esc(r.name)+' <b class="num">'+r.credited+'</b></span>'}).join('');
  var status=rem>0?'<span class="'+(isToday?'':'neg')+'">'+rem+' more unique customers needed to reach '+st.target+'</span>':'<span class="pos">Target of '+st.target+' reached'+(over?', '+over+' over':'')+'</span>';
  return '<div class="panel"><h2>'+(isToday?'Company target today':'Company target, '+fdate(st.date))+'</h2><div class="goal"><span class="gnum num">'+st.unique+'</span><span class="gof">of '+st.target+' unique customers visited</span></div>'+

function kpisFor(st,isToday){

}
function repCards(st,isToday){
  if(!st.reps.length)return empty('No salespeople yet','Approve your salespeople in the Team tab.');
  return st.reps.map(function(r){
    function cell(l,v){return '<div><div class="l">'+l+'</div><div class="v num">'+v+'</div></div>'}
    return '<div class="rep" style="border-inline-start-color:'+colorOf(r.id)+'"><div class="rh"><b>'+esc(r.name)+'</b><span class="num"><b>'+r.visits+'</b> visits</span></div><div class="rg">'+

function historyView(){
  var rows='',byDay={};S.hist.forEach(function(v){(byDay[v.visit_date]=byDay[v.visit_date]||{})[v.customer_id]=1});
  var first=S.hist.reduce(function(m,v){return v.visit_date<m?v.visit_date:m},'9999-12-31');
  for(var n=0;n<7;n++){var d=addDays(curDate(),-n);if(d<first&&d!==today())continue;
    var u=Object.keys(byDay[d]||{}).length,tg=targetFor(d),met=u>=tg;
    rows+='<div class="row"><div class="grow"><b>'+fdate(d)+'</b><div class="sub num">'+u+' of '+tg+' unique customers</div></div><div class="end">'+(met?badge('ok','Target met'):(d===today()?badge('info','In progress'):badge('bad','Short by '+(tg-u))))+'</div></div>'}
  return rows?'<h2 class="sh">Last 7 days</h2><div class="list">'+rows+'</div>':'';

    var c=cm[v.customer_id],b=[v.credited?badge('ok','Counted'):badge('mute','Repeat, counted once')];
    b.push(badge('mute','GPS \u00b1'+Math.round(v.accuracy||0)+' m'));if(v.far)b.push(badge('bad',v.distance_m+' m from saved location'));

function missedView(st){

/* ---- screen assembly ---- */
var ICON={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4V7zM3 7l9 4 9-4M12 11v10"/>',book:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM5 17a3 3 0 013-3h11"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-1a6 6 0 0112 0v1M17 4a4 4 0 010 7M22 21v-1a6 6 0 00-4-5.6"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
var OTABS=[['home','Home','home'],['visits','Visits','pin'],['sales','Sales','receipt'],['stock','Stock','box'],['books','Money','book'],['people','Team','users']];
var TITLES={home:'Dashboard',visits:'Field visits',sales:'Sales',stock:'Stock and orders',books:'Money',people:'Team management',settings:'Settings'};
function navHTML(items,cur){return '<div class="brand">Ledgerline</div>'+items.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[t[2]]+'</svg><span>'+t[1]+'</span></button>'}).join('')}
function render(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  var nav=$('nav'),top=$('top'),view=$('view'),err=S.err?'<div class="note neg">'+esc(S.err)+'</div>':'';
  if(S.view!=='app'){
    document.body.className='picker';nav.style.display='none';setHTML(top,'<div class="util"><span class="push"></span><button class="lnk" data-a="lang">'+(L==='ar'?'English':'العربية')+'</button></div>');
    setHTML(view,err+(S.view==='boot'?'<p class="muted">Loading...</p>':S.view==='login'?viewLogin():S.view==='signup'?viewSignup():S.view==='pending'?viewPending():'<div class="note neg">No profile was found for this login. Ask the owner to check the setup.</div>'));
    renderSheet();return;
  }
  var own=isOwner();document.body.className=own?'role-owner':'role-rep';
  if(own){
    nav.style.setProperty('--n',6);nav.style.display='';setHTML(nav,navHTML(OTABS,S.tab));
    var act=S.tab==='visits'&&S.sub==='assign'?'<button class="btn primary" data-a="add-cust">Add customer</button>':'';
    setHTML(top,utilBar('<span class="brandsm">Ledgerline</span>',true)+'<div class="trow"><div><h1>'+TITLES[S.tab]+'</h1></div>'+act+'</div>');
    var v=S.tab==='home'?viewHome():S.tab==='visits'?viewVisits():S.tab==='people'?viewTeam():S.tab==='settings'?viewSettings():viewSoon(TITLES[S.tab],S.tab==='sales'?'Stage 3':S.tab==='stock'?'Stage 3':'Stage 4');
    setHTML(view,err+v);
  }else{
    var items=[['today','Today','list'],['day','My day','chart']];nav.style.setProperty('--n',2);nav.style.display=S.visit?'none':'';setHTML(nav,S.visit?'':navHTML(items,S.tab==='day'?'day':'today'));
    setHTML(top,utilBar(S.visit?'<button class="lnk" data-a="back">\u2039 Back</button>':'',false)+(S.visit?'':repGreeting()));
    setHTML(view,err+(S.visit?viewVisit():S.tab==='day'?viewRepDay():viewRepToday()));
  }
  renderSheet();
}
var toastT;function toast(m,bad){var t=$('toast');t.textContent=trText(m);t.className=bad?'err':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},bad?4200:2400)}

/* ---- data ---- */
async function loadAll(){
  var d=curDate(),owner=isOwner(),jobs=[sb.rpc('progress_today'),sb.from('customers').select('*').order('name'),sb.from('visits').select('*').eq('visit_date',d).order('checked_in_at')];
  if(owner){jobs.push(sb.from('profiles').select('*').order('created_at'));jobs.push(sb.from('target_history').select('*'));jobs.push(sb.from('visits').select('visit_date,customer_id,rep_id').gte('visit_date',addDays(d,-6)).lte('visit_date',d))}
  var r=await Promise.all(jobs),bad=r.filter(function(x){return x.error})[0];
  if(bad){S.err=/does not exist|schema cache|Could not find/i.test(bad.error.message||'')?'The Stage 2 database setup has not been run yet. Run ledgerline-cloud-setup-2 in Supabase.':bad.error.message}
  S.progress=r[0].error?null:r[0].data;S.customers=r[1].error?[]:r[1].data;S.visits=r[2].error?[]:r[2].data;
  if(owner){if(!r[3].error)S.team=r[3].data;if(!r[4].error)S.targets=r[4].data;if(!r[5].error)S.hist=r[5].data}
}
async function refresh(){
  try{
    var r=await sb.auth.getSession();S.session=r.data&&r.data.session;
    if(!S.session){S.profile=null;S.checks=null;if(S.view!=='signup')S.view='login';render();return}
    var p=await sb.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle();
    if(p.error){S.err=p.error.message;S.view='noprofile';render();return}
    S.profile=p.data;
    if(!S.profile)S.view='noprofile';else if(!S.profile.active)S.view='pending';else{S.view='app';S.err='';if(isOwner()&&S.tab==='today')S.tab='home';if(!isOwner()&&!/^(today|day)$/.test(S.tab))S.tab='today';await loadAll()}
  }catch(e){S.err=String(e&&e.message||e)}
  render();
}
var rt;function queue(){clearTimeout(rt);rt=setTimeout(refresh,60)}
function getPos(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej(new Error('GPS is not available on this device.'));
  navigator.geolocation.getCurrentPosition(function(p){if(p.coords.accuracy>200)return rej(new Error('GPS signal is weak. Move to open sky and try again.'));res(p.coords)},
    function(e){rej(new Error(e.code===1?'Location access is blocked. Allow location for this website in Safari settings, then try again.':'Your location could not be determined. Try again.'))},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
})}

/* ---- security check ---- */
async function runChecks(){
  S.busy=true;S.checks=null;render();
  var list=[],owner=isOwner(),uid=S.profile.id;
  function add(n,ok){list.push({name:n,ok:!!ok})}
  var rls=function(e){return !!e&&/row-level security/i.test(e.message||'')};
  var own=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();add('Your own profile can be read',!own.error&&own.data&&own.data.id===uid);
  var oo=await sb.from('owner_only_test').select('*');var n1=oo.error?0:(oo.data||[]).length;add('Owner-only data is visible to the owner only',owner?n1>=1:n1===0);
  var tt=await sb.from('team_test').select('*');add('Shared team data is visible to approved members',!tt.error&&(tt.data||[]).length>=1);
  var cu=await sb.from('customers').select('*');add('Customers: you only see what the rules allow',!cu.error&&(owner||(cu.data||[]).every(function(c){return c.assigned_to===uid})));
  var pg=await sb.rpc('progress_today');add('The company progress totals can be read',!pg.error&&pg.data&&typeof pg.data.target==='number');
  if(!owner){
    var up=await sb.from('profiles').update({full_name:S.profile.full_name}).eq('id',uid).select();add('You cannot edit your own record (so nobody can make themselves owner)',!!up.error||(up.data||[]).length===0);
    var iv=await sb.from('visits').insert({visit_date:today(),customer_id:-1,rep_id:uid,lat:0,lng:0});add('Visits cannot be written directly, only by checking in',rls(iv.error));
    var it=await sb.from('target_history').insert({effective_from:'1900-01-01',value:1});add('Only the owner can change the company target',rls(it.error));
    var uc=await sb.from('customers').update({name:'x'}).eq('id',-1).select();add('You cannot edit customers owned by the owner',!!uc.error||(uc.data||[]).length===0);
  }
  var anon=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var none=function(r){return !!r.error||(r.data||[]).length===0},res=[],tbs=['owner_only_test','team_test','profiles','customers','visits','target_history'];
  for(var i=0;i<tbs.length;i++)res.push(none(await anon.from(tbs[i]).select('*')));
  var ap=await anon.rpc('progress_today');res.push(!!ap.error);add('Someone who is not signed in cannot read anything',res.every(Boolean));
  S.checks={list:list,ok:list.every(function(c){return c.ok})};S.busy=false;render();
}

/* ---- events ---- */
document.addEventListener('submit',async function(e){
  e.preventDefault();var f=e.target,k=f.dataset.form,fd=new FormData(f);S.err='';
  if(k==='login'||k==='signup'){S.draft={};['full_name','phone','email'].forEach(function(n){if(fd.get(n)!=null)S.draft[n]=String(fd.get(n))})}
  try{
    if(k==='login'){
      S.busy=true;render();var r=await sb.auth.signInWithPassword({email:String(fd.get('email')).trim(),password:String(fd.get('password'))});
      S.busy=false;if(r.error){S.err=r.error.message;render();return}S.draft={};await refresh();
    }else if(k==='signup'){
      var name=String(fd.get('full_name')).trim(),phone=String(fd.get('phone')).trim(),email=String(fd.get('email')).trim(),pw=String(fd.get('password'));
      if(!name||!phone||!email){S.err=trText('Enter your name, phone and email.');render();return}
      if(pw.length<8){S.err=trText('Use at least 8 characters for the password.');render();return}
      S.busy=true;render();var s=await sb.auth.signUp({email:email,password:pw,options:{data:{full_name:name,phone:phone}}});
      S.busy=false;if(s.error){S.err=s.error.message;render();return}S.draft={};
      if(s.data&&s.data.session){await refresh()}else{var li=await sb.auth.signInWithPassword({email:email,password:pw});
        if(li.error){S.err=trText('Account created, but you cannot sign in yet. Ask the owner to finish the setup.')+' ('+li.error.message+')';S.view='login';render()}else{await refresh()}}
    }else if(k==='customer'){
      var d=(S.sheet&&S.sheet.data)||{},nm=String(fd.get('name')).trim();if(!nm){toast('Name is required',true);return}
      var row={name:nm,phone:String(fd.get('phone')||'').trim(),address:String(fd.get('address')||'').trim()},res;
      if(isOwner()){row.assigned_to=fd.get('assigned_to')||null;row.active=fd.get('active')==='on'}
      if(d.id)res=await sb.from('customers').update(row).eq('id',d.id).select();
      else{if(!isOwner()){row.assigned_to=S.profile.id;row.created_by=S.profile.id}res=await sb.from('customers').insert(row).select()}
      if(res.error){toast(res.error.message,true);return}
      S.sheet=null;await loadAll();render();toast('Customer saved');
    }else if(k==='target'){
      var val=parseInt(fd.get('value'),10),from=String(fd.get('from'));
      if(!(val>=1&&val<=1000)){toast('Enter a target between 1 and 1000.',true);return}
      if(from<today()){toast('The new target must start today or later.',true);return}
      var up=await sb.from('target_history').upsert({effective_from:from,value:val},{onConflict:'effective_from'});
      if(up.error){toast(up.error.message,true);return}
      S.sheet=null;await loadAll();render();toast('Target saved');
    }else if(k==='finish'){
      S.busy=true;render();var fr=await sb.rpc('finish_visit',{p_visit:S.visit,p_note:String(fd.get('note')||'')});S.busy=false;
      if(fr.error){S.err=fr.error.message;render();return}
      await loadAll();S.visit=null;render();toast('Visit finished');
    }
  }catch(x){S.busy=false;S.err=String(x&&x.message||x);render()}
});
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;S.err='';
  try{
    if(a==='lang'){L=L==='ar'?'en':'ar';try{localStorage.setItem('ll_lang',L)}catch(x){}render()}
    else if(a==='to-signup'){S.view='signup';S.draft={};render()}
    else if(a==='to-login'){S.view='login';S.draft={};render()}
    else if(a==='signout'){await sb.auth.signOut();S.view='login';S.profile=null;S.session=null;S.team=[];S.customers=[];S.visits=[];S.hist=[];S.checks=null;S.visit=null;S.sheet=null;S.tab='home';S.vd=null;render()}
    else if(a==='refresh'){await refresh()}
    else if(a==='tab'){S.tab=b.dataset.t;S.visit=null;S.checks=null;render();window.scrollTo(0,0)}
    else if(a==='goto'){S.tab=b.dataset.t;if(b.dataset.s)S.sub=b.dataset.s;S.visit=null;S.checks=null;render();window.scrollTo(0,0)}
    else if(a==='sub'){S.sub=b.dataset.s;render()}
    else if(a==='vtoday'){S.vd=null;await loadAll();render()}
    else if(a==='check'){await runChecks()}
    else if(a==='toggle'){var on=b.dataset.on==='1',r=await sb.from('profiles').update({active:on}).eq('id',b.dataset.id).select();if(r.error)toast(r.error.message,true);else toast(on?'Approved':'Updated');await loadAll();render()}
    else if(a==='add-cust'){S.sheet={type:'customer',data:{}};render()}
    else if(a==='edit-cust'){S.sheet={type:'customer',data:{id:+b.dataset.id}};render()}
    else if(a==='open-target'){S.sheet={type:'target'};render()}
    else if(a==='close-sheet'){S.sheet=null;render()}
    else if(a==='assign-clear'){S.sel={};render()}
    else if(a==='sel-all'){custList().forEach(function(c){S.sel[c.id]=true});setHTML($('clist'),custRows());setHTML($('selbar'),selbarHTML())}
    else if(a==='assign-apply'){
      var ids=Object.keys(S.sel).filter(function(k){return S.sel[k]}).map(Number);if(!ids.length){toast('Select at least one customer.',true);return}
      var ur=await sb.from('customers').update({assigned_to:S.arep||null}).in('id',ids).select();if(ur.error){toast(ur.error.message,true);return}
      S.sel={};await loadAll();render();toast('Assigned');
    }
    else if(a==='back'){S.visit=null;render()}
    else if(a==='open-visit'){S.visit=+b.dataset.id;render();window.scrollTo(0,0)}
    else if(a==='checkin'){
      b.disabled=true;b.textContent=trText('Getting location...');
      try{var pos=await getPos();var cr=await sb.rpc('check_in',{p_customer:+b.dataset.id,p_lat:pos.latitude,p_lng:pos.longitude,p_acc:pos.accuracy});
        if(cr.error)throw new Error(cr.error.message);await loadAll();S.visit=cr.data.id;render();window.scrollTo(0,0)}
      catch(x){S.err=trText(x.message);render()}
    }
  }catch(x){S.err=String(x&&x.message||x);render()}
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el)return;
  if(el.id==='q'){S.q=el.value;setHTML($('clist'),custRows())}
  else if(el.id==='vq'){S.vq=el.value;S.vq=el.value;var p=el.selectionStart;render();var n=$('vq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}
});
document.addEventListener('change',async function(e){
  var el=e.target;if(!el)return;
  if(el.id==='fil'){S.filter=el.value;setHTML($('clist'),custRows())}
  else if(el.id==='arep'){S.arep=el.value}
  else if(el.id==='vdate'){S.vd=(el.value&&el.value!==today())?el.value:null;await loadAll();render()}
  else if(el.dataset&&el.dataset.k==='sel'){S.sel[el.dataset.id]=el.checked;setHTML($('selbar'),selbarHTML())}
});
setInterval(async function(){if(S.view==='app'&&isOwner()&&S.tab==='home'&&!S.sheet&&!document.hidden){try{await loadAll();render()}catch(e){}}},30000);

if(!window.supabase||!window.supabase.createClient){S.view='login';S.err=trText('Could not load the app. Check your internet connection and refresh.');render();return}
sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
sb.auth.onAuthStateChange(function(){queue()});
render();refresh();
window.__ll={S:S,MISS:MISS,render:render};
})();

</script>
